name: Android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Publish screenshots to the screenshots branch
        if: always() && github.event_name == 'push'
        run: |
          [ -d app/build/screenshots ] && [ -n "$(ls -A app/build/screenshots)" ] || exit 0
          cd app/build/screenshots
          git init -q && git checkout -q -b screenshots
          git add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshots for ${GITHUB_SHA::7}"
          git push -fq "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screenshots
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/app/build/reports/tests
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: commander-sim-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
