name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Forge engine build
        id: forge-cache
        uses: actions/cache@v4
        with:
          path: |
            android/app/libs/forge
            android/app/src/main/assets/forge
          key: forge-${{ hashFiles('forge.version', 'tools/build-forge.sh', 'tools/package_forge_res.py') }}
      - name: Build Forge engine and card data
        if: steps.forge-cache.outputs.cache-hit != 'true'
        working-directory: .
        run: tools/build-forge.sh
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/app/build/reports/tests
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: commander-sim-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Read app version
        id: version
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/commander-sim-v$VERSION.apk"
      - name: Publish or update the GitHub release for this version
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Commander Sim ${{ steps.version.outputs.tag }}
          files: android/app/build/outputs/apk/debug/commander-sim-${{ steps.version.outputs.tag }}.apk
          generate_release_notes: true
          overwrite_files: true
