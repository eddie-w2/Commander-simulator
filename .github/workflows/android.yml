name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/app/build/reports/tests
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: commander-sim-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Check whether this version is released
        id: version
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/commander-sim-v$VERSION.apk"
          fi
      - name: Publish GitHub release for a new version
        if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Commander Sim ${{ steps.version.outputs.tag }}
          files: android/app/build/outputs/apk/debug/commander-sim-${{ steps.version.outputs.tag }}.apk
          generate_release_notes: true
